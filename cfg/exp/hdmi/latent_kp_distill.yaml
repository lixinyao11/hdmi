# @package _global_

# AnyBody Stage 2: sparse-keypoint encoder distilled against the frozen Stage 1 latent.
defaults:
  - override /algo: hdmi_latent_kp_distill

exp_name: hdmi-latent-kp-distill
seed: 0
total_iters: 9000
checkpoint_interval: 1000
upload_interval: 1000

algo:
  # Stage 1 run g907tzp5 (AnyBody defaults), best eval at iter 2000.
  stage1_checkpoint: run:xinyaoli511-sjtu-hpc-center/hdmi_anybody/g907tzp5:2000

task:
  observation:
    command_kp:
      # Robot-anchor frame (as AnyBody). The reference-anchor term mimic_lite.ref_body_pos_future_local
      # carries no robot drift; with it the student failed mid-motion on root_pos_error
      # (local A/B at 400 iters: 15.5% vs 44.9% completion with all keypoints visible).
      kp_pos:
        _target_: hdmi.ref_body_pos_future_robot_anchor
        body_names: [torso_link, left_wrist_yaw_link, right_wrist_yaw_link, left_toe_link, right_toe_link]
